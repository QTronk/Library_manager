# Đặt = true để chạy dữ liệu giả lập (Mock Data) test giao diện UI độc lập
# Đặt = false để kết nối Socket thật tới Backend Server
app.mock_mode=false

# Cấu hình IP và Port của Backend Server (Dành cho khi app.mock_mode=false)
# - Host: 127.0.0.1 chỉ đúng khi Backend chạy CÙNG máy với giao diện.
#         Nếu Backend chạy máy khác, điền IP LAN của máy đó (gõ ipconfig để xem IPv4).
# - Port: phải trùng với PORT trong LibraryServer.java của Backend (hiện là 8888).
app.server_host=127.0.0.1
app.server_port=8888
